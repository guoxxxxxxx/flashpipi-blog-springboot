rules:
  - !READWRITE_SPLITTING
    dataSources:
      readwrite_ds:
        staticStrategy:
          writeDataSourceName: blog_master
          readDataSourceNames:
            - blog_slave_0
            - blog_slave_1
        loadBalancerName: random
    loadBalancers:
      random:
        type: RANDOM
